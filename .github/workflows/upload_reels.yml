name: Instagram Reels Günlük Otomatik Paylaşım (18:00)

on:
  schedule:
    # 1. Ana Plan: Her gün Türkiye saatiyle 17:52 (14:52 UTC) - Saat başı yoğunluğunu aşarak tam 18:00 civarı yayına girer
    - cron: '52 14 * * *'
    # 2. Yedek Plan: 18:15 TSİ (15:15 UTC) - İlk tetikleme gecikirse güvenlik ağı
    - cron: '15 15 * * *'
    # 3. Yedek Plan: 18:45 TSİ (15:45 UTC) - İkinci güvenlik ağı
    - cron: '45 15 * * *'
  # GitHub Actions sekmesinden istenildiği an "Run workflow" ile elle başlatma
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Bugün paylaşım yapılmış olsa bile zorla paylaş (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Günlük ve Saat Kontrolü (Bugün Akşam Paylaşımı Yapıldı mı?)
        id: check_today
        run: |
          python -c "
          import json, os
          from datetime import datetime, timezone, timedelta
          trt_now = datetime.now(timezone(timedelta(hours=3)))
          today = trt_now.strftime('%Y-%m-%d')
          event_name = '${{ github.event_name }}'
          force_input = '${{ github.event.inputs.force_upload }}'.lower() == 'true'
          already_done = 'false'

          # Eğer otomatik zamanlayıcı (schedule) gece 00:00 - 16:30 TSİ arasında aşırı gecikmeli uyanırsa paylaşımı engelle
          if event_name == 'schedule' and trt_now.hour < 16:
              print(f'Gece/gündüz dışı gecikmeli çalışma ({trt_now.strftime(\"%H:%M\")} TSİ) atlanıyor. Akşam 18:00 beklenecek.')
              already_done = 'true'
          elif not force_input and os.path.exists('yuklenenler.json'):
              try:
                  with open('yuklenenler.json', encoding='utf-8') as f:
                      data = json.load(f)
                  for h in reversed(data.get('history', [])):
                      up_at = h.get('uploaded_at', '')
                      if up_at.startswith(today) and h.get('status') != 'manual':
                          # Sadece sabah 06:00'dan sonra yapılan paylaşımları bugünün 18:00 paylaşımı say
                          try:
                              up_hour = int(up_at[11:13])
                          except Exception:
                              up_hour = 18
                          if up_hour >= 6:
                              already_done = 'true'
                              print(f'Bugün ({today}) zaten paylaşılan Reels: {h.get(\"filename\")}')
                              break
              except Exception as e:
                  print('Kontrol uyarısı:', e)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'already_done={already_done}\n')
          "

      - name: Sıradaki Reels Videosunu Instagram'da Paylaş (@mufithocailematematik)
        if: steps.check_today.outputs.already_done != 'true'
        env:
          IG_TOKEN_JSON: ${{ secrets.IG_TOKEN_JSON }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event.inputs.force_upload }}" = "true" ]; then
            python upload_reels.py --force
          else
            python upload_reels.py
          fi

      - name: Takip Dosyasını (yuklenenler.json) Güncelle ve Kaydet
        if: steps.check_today.outputs.already_done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yuklenenler.json
          if git diff --staged --quiet; then
            echo "Takip dosyasında değişiklik yok."
          else
            MSG=$(cat last_uploaded.txt 2>/dev/null || echo "Instagram Reels paylaşıldı")
            git commit -m "Otomatik Reels Paylaşımı: $MSG"
            git pull --rebase origin main || true
            git push
          fi
