name: Instagram Reels Günlük Otomatik Paylaşım (18:00)

on:
  schedule:
    # GitHub Actions ücretsiz sunucularındaki 4-5 saatlik kuyruk gecikmesini telafi etmek için
    # öğleden itibaren kademeli tetikleyiciler (17:00 TSİ'den önce uyananlar 1 saniyede atlar,
    # 17:00 TSİ - 05:00 TSİ arasında uyanan ilk iş o günün paylaşımını gerçekleştirir):
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
    - cron: '30 12 * * *'
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
    - cron: '10 15 * * *'
    - cron: '50 15 * * *'
    - cron: '30 16 * * *'
  # GitHub Actions sekmesinden istenildiği an "Run workflow" ile elle başlatma
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Bugün paylaşım yapılmış olsa bile zorla paylaş (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Günlük ve Saat Kontrolü (Mantıksal Gün Penceresi: 06:00 - Ertesi Gün 05:59 TSİ)
        id: check_today
        run: |
          python -c "
          import json, os
          from datetime import datetime, timezone, timedelta
          trt_tz = timezone(timedelta(hours=3))
          trt_now = datetime.now(trt_tz)
          # Mantıksal paylaşım günü: Gece 00:00-05:59 arası sarkan çalışmaları bir önceki akşamın günü sayar
          logical_today = (trt_now - timedelta(hours=6)).strftime('%Y-%m-%d')
          event_name = '${{ github.event_name }}'
          force_input = '${{ github.event.inputs.force_upload }}'.lower() == 'true'
          already_done = 'false'

          # Otomatik zamanlayıcı (schedule) sabah 06:00 ile akşam 17:00 TSİ arasında erken uyanırsa bekle
          if event_name == 'schedule' and (6 <= trt_now.hour < 17):
              print(f'Erken uyanan tetikleyici ({trt_now.strftime(\"%H:%M\")} TSİ) atlanıyor. Akşam 17:00-18:00 penceresi bekleniyor.')
              already_done = 'true'
          elif not force_input and os.path.exists('yuklenenler.json'):
              try:
                  with open('yuklenenler.json', encoding='utf-8') as f:
                      data = json.load(f)
                  for h in reversed(data.get('history', [])):
                      if h.get('status') == 'manual':
                          continue
                      item_logical = h.get('logical_day')
                      if not item_logical:
                          up_at = h.get('uploaded_at', '')
                          if len(up_at) >= 19:
                              try:
                                  dt = datetime.fromisoformat(up_at)
                                  item_logical = (dt - timedelta(hours=6)).strftime('%Y-%m-%d')
                              except Exception:
                                  item_logical = up_at[:10]
                      if item_logical == logical_today:
                          already_done = 'true'
                          print(f'Bu mantıksal gün ({logical_today}) için zaten paylaşılan Reels: {h.get(\"filename\")}')
                          break
              except Exception as e:
                  print('Kontrol uyarısı:', e)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'already_done={already_done}\n')
          "

      - name: Sıradaki Reels Videosunu Instagram'da Paylaş (@mufithocailematematik)
        if: steps.check_today.outputs.already_done != 'true'
        env:
          IG_TOKEN_JSON: ${{ secrets.IG_TOKEN_JSON }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event.inputs.force_upload }}" = "true" ]; then
            python upload_reels.py --force
          else
            python upload_reels.py
          fi

      - name: Takip Dosyasını (yuklenenler.json) Güncelle ve Kaydet
        if: steps.check_today.outputs.already_done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yuklenenler.json
          if git diff --staged --quiet; then
            echo "Takip dosyasında değişiklik yok."
          else
            MSG=$(cat last_uploaded.txt 2>/dev/null || echo "Instagram Reels paylaşıldı")
            git commit -m "Otomatik Reels Paylaşımı: $MSG"
            git pull --rebase origin main || true
            git push
          fi
